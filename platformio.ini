; Nightstand Alarm Clock - ESP32-C3-MINI-1U
; Display: GC9A01 240x240 round IPS (SPI)
; Touch:   CST816S capacitive (I2C)

[env:esp32-c3-mini]
platform  = espressif32@6.5.0
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600

board_build.flash_mode   = qio
board_build.f_flash      = 80000000
board_build.partitions   = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI     @ ^2.5.43
    lvgl/lvgl           @ ^8.3.11
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; ---- TFT_eSPI: GC9A01 240x240 ----
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=7
    -D TFT_SCLK=6
    -D TFT_CS=10
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=3
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000

    ; ---- LVGL: use src/lv_conf.h ----
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I src
